apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: parser-cluster
servers: 1
agents: 0
ports:
  - port: 8081:80      # Traefik Ingress  -> http://localhost:8081/parse
    nodeFilters: [loadbalancer]
  - port: 8333:8333    # SeaweedFS S3     -> http://localhost:8333
    nodeFilters: [loadbalancer]
