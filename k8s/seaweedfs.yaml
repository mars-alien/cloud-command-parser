# Single-node SeaweedFS (master+volume+filer+S3). S3 identities come from Secret seaweedfs-s3-config
# (generated by `make up`, never committed).
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: seaweedfs-data, namespace: data}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 4Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: seaweedfs, namespace: data}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: seaweedfs}}
  template:
    metadata: {labels: {app: seaweedfs}}
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:3.80
          args: ["server", "-dir=/data", "-master.volumeSizeLimitMB=128", "-volume.max=30",
                 "-filer", "-s3", "-s3.port=8333", "-s3.config=/etc/s3/s3.json"]
          ports: [{containerPort: 8333}]
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: s3, mountPath: /etc/s3, readOnly: true}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
          readinessProbe:
            tcpSocket: {port: 8333}
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: seaweedfs-data}
        - name: s3
          secret: {secretName: seaweedfs-s3-config}
---
apiVersion: v1
kind: Service
metadata: {name: seaweedfs, namespace: data}
spec:
  type: LoadBalancer      # k3s servicelb publishes 8333 on the node -> k3d maps it to localhost:8333
  selector: {app: seaweedfs}
  ports: [{name: s3, port: 8333, targetPort: 8333}]
