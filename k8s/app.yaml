apiVersion: apps/v1
kind: Deployment
metadata: {name: parser, namespace: app}
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector: {matchLabels: {app: parser}}
  template:
    metadata: {labels: {app: parser}}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: parser
          image: parser-service:1.0
          imagePullPolicy: Never
          ports: [{containerPort: 8000}]
          env:
            - {name: MODEL_URI, value: "s3://models/v1/"}
            - {name: MODEL_VERSION, value: "v1"}
            - {name: S3_ENDPOINT, value: "http://seaweedfs.data.svc.cluster.local:8333"}
            - {name: MAX_NEW_TOKENS, value: "64"}
            - {name: OMP_NUM_THREADS, value: "1"}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: AWS_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: s3-credentials, key: AWS_ACCESS_KEY_ID}}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: s3-credentials, key: AWS_SECRET_ACCESS_KEY}}
          resources:
            requests: {cpu: 500m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet: {path: /readyz, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 3
            failureThreshold: 2
          lifecycle:
            preStop:
              exec: {command: ["sleep", "8"]}
---
apiVersion: v1
kind: Service
metadata: {name: parser, namespace: app}
spec:
  selector: {app: parser}
  ports: [{port: 80, targetPort: 8000}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: parser, namespace: app}
spec:
  rules:
    - http:
        paths:
          - path: /parse
            pathType: Prefix
            backend: {service: {name: parser, port: {number: 80}}}
